[workspace]
members = ["."]
resolver = "3"

[package]
name = "epic-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "A local-first personal investment platform"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "epic-platform"
path = "src/main.rs"
required-features = ["ssr"]

[dependencies]
leptos = "0.8.20"
leptos_meta = "0.8"
leptos_router = "0.8"
axum = { version = "0.8.9", optional = true }
leptos_axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"], optional = true }
# Keep the CLI version in README in sync with this exact version.
wasm-bindgen = { version = "=0.2.128", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
serde = { version = "1", features = ["derive"] }
rust_decimal = { version = "1", default-features = false, features = ["serde", "std"] }
csv = { version = "1", optional = true }
chrono = { version = "0.4", optional = true }
gloo-net = { version = "0.6", optional = true }
send_wrapper = { version = "0.6", features = ["futures"], optional = true }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
serde_json = "1"

[features]
default = []
ssr = ["dep:axum", "dep:leptos_axum", "dep:tokio", "dep:csv", "dep:chrono", "leptos/ssr", "leptos_meta/ssr", "leptos_router/ssr"]
hydrate = ["leptos/hydrate", "dep:wasm-bindgen", "dep:console_error_panic_hook", "dep:gloo-net", "dep:send_wrapper"]

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name = "epic-platform"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["ssr"]
bin-default-features = false
bin-cargo-args = ["--locked"]
lib-features = ["hydrate"]
lib-default-features = false
lib-cargo-args = ["--locked"]
lib-profile-release = "wasm-release"
